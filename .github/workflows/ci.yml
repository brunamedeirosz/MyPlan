name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: myplan
          POSTGRES_USER: myplan
          POSTGRES_PASSWORD: myplan-ci-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_ENGINE: postgresql
      DB_NAME: myplan
      DB_USER: myplan
      DB_PASSWORD: myplan-ci-only
      DB_HOST: 127.0.0.1
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-production.txt
      - run: python manage.py check && python manage.py makemigrations --check --dry-run && python manage.py test && python -m pip check
        working-directory: backend
      - run: npm ci && npm run lint && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - name: Check production settings
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.production
          DJANGO_DEBUG: 'false'
          SECRET_KEY: ci-only-random-placeholder-long-enough-for-settings-check-2026
          ALLOWED_HOSTS: myplan.example.com
        run: python manage.py check --deploy --fail-level WARNING
      - name: Build production image
        run: docker build -t myplan:ci .
      - name: Start production image
        run: >-
          docker run -d --name myplan-smoke --network host
          -e DB_ENGINE -e DB_NAME -e DB_USER -e DB_PASSWORD -e DB_HOST
          -e ALLOWED_HOSTS=127.0.0.1,localhost
          -e SECRET_KEY=ci-only-random-placeholder-long-enough-for-settings-check-2026
          -e TRUST_PROXY_HTTPS=true -e DB_SSLMODE=disable -e PORT=8000 myplan:ci
      - name: Smoke test production image
        working-directory: frontend
        run: node scripts/smoke-production.mjs
      - name: Container logs
        if: always()
        run: docker logs myplan-smoke || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results-linux
          path: |
            frontend/test-results/
            frontend/playwright-report/
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results-windows
          path: |
            frontend/test-results/
            frontend/playwright-report/
